<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECI Logistics Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: navy ECI header band, navy page rail on the left (top tab strip on phones), white report canvas with cards */
:root{
  --navy:#0B2545; --navy-2:#13315C; --eci:#1F5FD1; --eci-soft:#E8F0FC;
  --bg:#F3F5F9; --panel:#FFFFFF; --ink:#0E1A2B; --ink-2:#4A5568; --ink-3:#7A8496;
  --line:#E2E7EF; --line-2:#EEF1F6; --hover:#F6F9FE;
  --good:#1B7A3E; --good-bg:#E6F4EA; --warn:#9A6500; --warn-bg:#FDF3DC; --bad:#B3261E; --bad-bg:#FCE8E6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --tgt:#0E1A2B; --muted-bar:#BFD3F2; --gap:#EDF0F5;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --eci:#5B9BEA; --eci-soft:#16294A; --bg:#0A1220; --panel:#111C2E; --ink:#E8EDF5; --ink-2:#B4BFCF; --ink-3:#8592A6;
  --line:#22314A; --line-2:#1A2740; --hover:#16233A;
  --good:#5CC983; --good-bg:#12301F; --warn:#E8B44C; --warn-bg:#33270F; --bad:#F08A80; --bad-bg:#3A1A18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --tgt:#E8EDF5; --muted-bar:#2C4A78; --gap:#1A2740; color-scheme:dark}}
:root[data-theme="dark"]{
  --eci:#5B9BEA; --eci-soft:#16294A; --bg:#0A1220; --panel:#111C2E; --ink:#E8EDF5; --ink-2:#B4BFCF; --ink-3:#8592A6;
  --line:#22314A; --line-2:#1A2740; --hover:#16233A;
  --good:#5CC983; --good-bg:#12301F; --warn:#E8B44C; --warn-bg:#33270F; --bad:#F08A80; --bad-bg:#3A1A18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --tgt:#E8EDF5; --muted-bar:#2C4A78; --gap:#1A2740; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B2545}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0B2545;color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:3px solid #1F5FD1}
.top img{height:34px;width:auto;display:block}
.top .tag{font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#AFC3E3;flex:1;min-width:0}
.top .meta{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;background:#13315C;border:1px solid #2A4C80;border-radius:6px;padding:5px 10px;color:#DCE6F5;white-space:nowrap}
.chip b{color:#fff;font-weight:600}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{background:#0B2545;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#C9D6EA;padding:10px 12px;border-radius:8px;font-size:14px}
.rail a svg{flex:none;opacity:.85}
.rail a:hover{background:#13315C;color:#fff}
.rail a.on{background:#1F5FD1;color:#fff;font-weight:600}
.rail .sep{height:1px;background:#1E3A66;margin:8px 6px}
.rail .badge{margin-left:auto;background:#B3261E;color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px}
.rail .foot{margin-top:auto;padding:18px 12px 6px;font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#6F89B3;line-height:1.5}
main{min-width:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.crumb a{color:var(--eci);text-decoration:none}
.crumb a:hover{text-decoration:underline}
h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;margin:0;letter-spacing:.005em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-weight:400;font-size:16px;color:var(--ink-2);margin-left:10px;letter-spacing:0}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick.cur{color:var(--eci);font-weight:600}
.pick.cur select{border-color:var(--eci);box-shadow:0 0 0 1px var(--eci)}
.pick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.pick input,.pick select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.latest{border:1px solid var(--eci);background:var(--eci-soft);color:var(--eci);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:#0B2545;color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button.on{background:var(--eci);color:#0A1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--eci);color:#0A1220}}
.seg button:focus-visible,.card:focus-visible,tr.click:focus-visible,.row:focus-visible{outline:2px solid var(--eci);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcard{cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;transition:border-color .15s,background .15s}
.kcard:hover{border-color:var(--eci);background:var(--hover)}
.kcard .kl{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.kcard .kl span:last-child{color:var(--ink-3);font-size:12px}
.kcard .kv{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kcard .kv u{text-decoration:none;font-size:18px;color:var(--ink-2);margin-left:3px;font-weight:500}
.kcard .kb{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:2px}
.kcard .kt{font-size:12px;color:var(--ink-3)}
.kcard .open{position:absolute;top:12px;right:12px;color:var(--ink-3);opacity:0;transition:opacity .15s}
.kcard:hover .open{opacity:1}
.delta{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}.delta.nu{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--line-2);color:var(--ink-3)}
.grid2{align-items:start;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;margin-top:12px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:1000px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ch .n{font-size:12px;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--tgt);border-radius:0;vertical-align:3px}
.cw{position:relative}
.cw svg{display:block;width:100%;overflow:visible}
.cw text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.cw .vl{fill:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(11,37,69,.15);white-space:nowrap;z-index:3}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r span:first-child{color:var(--ink-2)}
.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:1000px){.depts{grid-template-columns:minmax(0,1fr)}}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dh a{font-size:12px;color:var(--eci);text-decoration:none;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 64px minmax(0,auto);align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line-2);cursor:pointer;border-radius:6px}
.row:hover{background:var(--hover)}
.row .nm{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--ink-3);font-size:11px}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row .v small{display:block;color:var(--ink-3);font-weight:400;font-size:11px}
.row .pill{justify-self:end}
.tw{overflow-x:auto;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
td.sub2{padding-left:24px;color:var(--ink-2)}
.nf{color:var(--ink-3);font-style:italic}
.att{display:flex;flex-direction:column}
.att .row{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,auto)}
.metaline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mchip{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;color:var(--ink-2)}
.mchip b{color:var(--ink);font-weight:600}
.def{max-width:72ch;color:var(--ink-2);margin-top:8px}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media(max-width:900px){.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
.big .card .l{font-size:12px;color:var(--ink-3)}
.big .card .v{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.big .card .s{font-size:12px;color:var(--ink-2)}
.cmt{border-left:3px solid var(--warn);border-radius:0;background:var(--warn-bg);padding:10px 14px;margin-top:12px;font-size:13px}
.cmt b{display:block;font-size:12px;color:var(--warn);margin-bottom:2px}
.note{font-size:12px;color:var(--ink-3);margin-top:10px}
.cbar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.cbar span{display:block;height:100%;background:var(--s1)}
@media(max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4}
  .rail a{white-space:nowrap;padding:8px 12px;font-size:13px}
  .rail .sep,.rail .foot{display:none}
  .top .tag{display:none}
  h1{font-size:28px}
  .kcard .kv{font-size:28px}
}
@media(max-width:480px){.top .meta .chip:first-child{display:none}.row{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,auto)}.row svg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
html,body{margin:0}
.shell{display:block;min-height:0}
.wrap{max-width:1280px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--eci);background:var(--eci);color:#fff;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600}
.btn.ghost{background:var(--panel);color:var(--eci)}
.navb{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.navb:disabled{opacity:.35;cursor:default}
.empty{max-width:560px;margin:48px auto;text-align:center;padding:32px 24px}
.empty h2{font-size:26px;margin-bottom:6px}
.empty p{color:var(--ink-2);margin:6px 0 18px}
.empty .fmt{text-align:left;margin-top:22px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px}
.empty code{font-size:12px;background:var(--line-2);padding:1px 5px;border-radius:4px}
.drop{position:fixed;inset:0;z-index:20;background:rgba(11,37,69,.72);color:#fff;display:none;align-items:center;justify-content:center;font-family:var(--f-display);font-size:28px;letter-spacing:.04em}
.drop.on{display:flex}
.warnbox{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;margin-bottom:12px;font-size:13px;border-radius:0 6px 6px 0}
.err{border-left-color:var(--bad);background:var(--bad-bg)}
.kcard .kt b{color:var(--ink-2);font-weight:600}
.pgrp{display:inline-flex;gap:6px;align-items:center;min-width:0}.pgrp select{max-width:62vw}
.top .home{display:block;border-radius:4px}.top .home:focus-visible{outline:2px solid #fff;outline-offset:3px}
.srcnote{font-size:11px;color:var(--ink-3)}
.cw svg rect.bar{cursor:pointer}
.cmts{margin:8px 0 0;padding:0;list-style:none}
.cmts li{padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.cmts li small{color:var(--ink-3);display:block}
td .pill{font-size:11px}
@media(max-width:600px){td .nf{display:none}td,th{padding:8px 5px}.ctrls{width:100%}.ctrls .seg{order:-1}}
</style>
</head>

        const t=c.getAttribute('t'); const v=c.getElementsByTagName('v')[0]; let val=null;
        if(t==='s') val=v?SS[+v.textContent]:null;
        else if(t==='inlineStr') val=kids(c,'t').map(x=>x.textContent).join('');
        else if(t==='str'||t==='e') val=v?v.textContent:null;
        else if(t==='b') val=v?v.textContent==='1':null;
        else val=v&&v.textContent!==''?+v.textContent:null;
        arr[colIdx(c.getAttribute('r'))]=val;
      });
      rows.push(arr);
    });
    sheets[sh.getAttribute('name').trim().toLowerCase()]=rows;
  }
  return sheets;
}

/* ================= calendar ================= */
const DAY=864e5;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const D=t=>new Date(t);
const isoD=t=>D(t).toISOString().slice(0,10);
function isoWeek(t){const d=D(t);const dw=(d.getUTCDay()+6)%7;const th=t+(3-dw)*DAY;const y=D(th).getUTCFullYear();return{y,w:1+Math.floor((th-Date.UTC(y,0,1))/DAY/7)}}
function weekMonday(y,w){const j4=Date.UTC(y,0,4);const dw=(D(j4).getUTCDay()+6)%7;return j4-dw*DAY+(w-1)*7*DAY}
const KEY={
  D:t=>isoD(t),
  W:t=>{const k=isoWeek(t);return k.y+'-W'+pad(k.w)},
  M:t=>{const d=D(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)},
  Q:t=>{const d=D(t);return d.getUTCFullYear()+'-Q'+(Math.floor(d.getUTCMonth()/3)+1)}
};
function fmtDay(t){const d=D(t);return pad(d.getUTCDate())+' '+MN[d.getUTCMonth()]}
function label(g,k,short){
  if(g==='D'){const t=Date.parse(k+'T00:00:00Z');const d=D(t);return short?pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1):DN[d.getUTCDay()]+' '+fmtDay(t)+' '+d.getUTCFullYear()}
  if(g==='W'){const[y,w]=k.split('-W').map(Number);if(short)return 'W'+pad(w);const m=weekMonday(y,w);return 'W'+pad(w)+' '+y+' · '+fmtDay(m)+' – '+fmtDay(m+6*DAY)}
  if(g==='M'){const[y,m]=k.split('-').map(Number);return short?MN[m-1]:MN[m-1]+' '+y}
  const[y,q]=k.split('-Q');return short?'Q'+q:'Q'+q+' '+y;
}
const GN={D:'Day',W:'Week',M:'Month',Q:'Quarter'};

/* ================= data model ================= */
let DEF=[], ROWS=[], META=null, IDX=null, WARN=[];
function toDate(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return Math.round((v-25569))*DAY;
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return Date.UTC(+m[3],+m[2]-1,+m[1]);
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return Date.UTC(+m[1],+m[2]-1,+m[3]);
  return null;
}
const num=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;const s=String(v).trim().replace(/\s/g,'').replace(',','.');const pct=s.endsWith('%');const n=parseFloat(s);return isNaN(n)?null:(pct?n/100:n)};
function table(rows,need){
  const hi=rows.findIndex(r=>r&&r.some(c=>typeof c==='string'&&need.includes(c.trim().toLowerCase())));
  if(hi<0) return null;
  const H={}; rows[hi].forEach((c,i)=>{if(typeof c==='string')H[c.trim().toLowerCase()]=i});
  return {H,body:rows.slice(hi+1)};
}
function parse(sheets){
  WARN=[];
  const data=sheets['data']; if(!data) throw new Error('No sheet named "Data" in this file. Use the template format.');
  const td=table(data,['date','level','kpi','value']);
  if(!td||['date','level','kpi','value'].some(h=>td.H[h]==null)) throw new Error('The Data sheet needs the columns Date, Level, KPI and Value.');
  const defs=[]; const ks=sheets['kpis'];
  if(ks){const tk=table(ks,['kpi','combine']);
    if(tk) tk.body.forEach(r=>{const g=h=>tk.H[h]!=null?r[tk.H[h]]:null;const name=g('kpi');if(!name||!String(name).trim())return;
      let comb=String(g('combine')||'Sum').trim().toLowerCase();comb=comb.startsWith('av')?'avg':comb.startsWith('la')?'last':comb.startsWith('ra')?'ratio':'sum';
      const better=String(g('better')||'Higher').trim().toLowerCase().startsWith('l')?-1:1;
      defs.push({name:String(name).trim(),unit:String(g('unit')||'').trim(),comb,num:g('numerator kpi')?String(g('numerator kpi')).trim():null,den:g('denominator kpi')?String(g('denominator kpi')).trim():null,target:num(g('target')),better});
    });}
  const known=new Set(defs.map(d=>d.name.toLowerCase()));
  const rows=[], skip={}; let bad=0;
  td.body.forEach(r=>{const g=h=>r[td.H[h]];const k=g('kpi');if(k==null||String(k).trim()==='')return;
    const t=toDate(g('date')), v=num(g('value'));let lv=String(g('level')||'Day').trim().toLowerCase();lv=lv.startsWith('w')?'W':lv.startsWith('m')?'M':'D';
    if(t==null||v==null){bad++;return}
    let name=String(k).trim();
    if(!known.has(name.toLowerCase())){ if(defs.length){skip[name]=(skip[name]||0)+1;return} defs.push({name,unit:'',comb:'sum',target:null,better:1});known.add(name.toLowerCase()); }
    else name=defs.find(d=>d.name.toLowerCase()===name.toLowerCase()).name;
    rows.push({t,lv,k:name,v,note:td.H['comment']!=null&&r[td.H['comment']]!=null?String(r[td.H['comment']]):''});
  });
  if(bad) WARN.push(bad+' row(s) skipped because the date or value is empty or not a number.');
  Object.keys(skip).forEach(n=>WARN.push(skip[n]+' row(s) for "'+n+'" skipped: this KPI is not on the KPIs sheet.'));
  defs.filter(d=>d.comb==='ratio'&&(!known.has((d.num||'').toLowerCase())||!known.has((d.den||'').toLowerCase()))).forEach(d=>WARN.push('"'+d.name+'" is a Ratio but its numerator or denominator KPI is missing on the KPIs sheet.'));
  if(!rows.length) throw new Error('No usable rows found on the Data sheet.');
  const tg=[]; const ts=sheets['targets'];
  if(ts){const tt=table(ts,['date','level','kpi','budget','forecast','target']); let tb=0; const tskip={};
    if(tt&&tt.H['date']!=null&&tt.H['kpi']!=null&&(tt.H['budget']!=null||tt.H['target']!=null||tt.H['forecast']!=null)) tt.body.forEach(r=>{const g=h=>tt.H[h]!=null?r[tt.H[h]]:null;const k=g('kpi');if(k==null||String(k).trim()==='')return;
      const tm=toDate(g('date')),b=num(g('budget')!=null?g('budget'):g('target')),f=num(g('forecast'));let lv=String(g('level')||'Month').trim().toLowerCase();lv=lv.startsWith('d')?'D':lv.startsWith('w')?'W':lv.startsWith('q')?'Q':'M';
      if(tm==null||(b==null&&f==null)){tb++;return}
      const d=defs.find(x=>x.name.toLowerCase()===String(k).trim().toLowerCase()); if(!d){tskip[k]=1;return}
      tg.push({t:tm,lv,k:d.name,b,f});});
    if(tb) WARN.push(tb+' target row(s) skipped because the date is empty or both Budget and Forecast are empty.');
    Object.keys(tskip).forEach(n=>WARN.push('Targets sheet: "'+n+'" is not on the KPIs sheet, its targets are ignored.'));}
  return {defs,rows,tg};
}
function build(){
  IDX={day:{},back:{W:{},M:{}},byG:{W:{},M:{}},periods:{D:new Set(),W:new Set(),M:new Set(),Q:new Set()},max:0};
  ROWS.forEach(r=>{
    IDX.max=Math.max(IDX.max,r.t);
    if(r.lv==='D'){
      const d=(IDX.day[r.k]=IDX.day[r.k]||{}); (d[KEY.D(r.t)]=d[KEY.D(r.t)]||[]).push(r);
      ['W','M'].forEach(g=>{const m=(IDX.byG[g][r.k]=IDX.byG[g][r.k]||{});(m[KEY[g](r.t)]=m[KEY[g](r.t)]||[]).push(r)});
      ['D','W','M','Q'].forEach(g=>IDX.periods[g].add(KEY[g](r.t)));
    }else{
      const m=(IDX.back[r.lv][r.k]=IDX.back[r.lv][r.k]||{}); (m[KEY[r.lv](r.t)]=m[KEY[r.lv](r.t)]||[]).push(r);
      IDX.periods[r.lv].add(KEY[r.lv](r.t)); if(r.lv==='M') IDX.periods.Q.add(KEY.Q(r.t));
    }
  });
  Object.keys(IDX.periods).forEach(g=>IDX.periods[g]=[...IDX.periods[g]].sort());
}
function combine(list,comb){
  if(!list||!list.length) return null;
  if(comb==='avg') return list.reduce((a,r)=>a+r.v,0)/list.length;
  if(comb==='last') return list.reduce((a,r)=>r.t>=a.t?r:a).v;
  return list.reduce((a,r)=>a+r.v,0);
}
function base(def,g,key){
  const c=def.comb, n=def.name;
  if(g==='D'){const l=(IDX.day[n]||{})[key];return l?{v:combine(l,c),src:'Daily data'}:null}
  if(g==='W'||g==='M'){
    const l=(IDX.byG[g][n]||{})[key];
    if(l){const days=new Set(l.map(r=>KEY.D(r.t))).size;return{v:combine(l,c),src:days+' day'+(days>1?'s':'')}}
    const b=(IDX.back[g][n]||{})[key];
    return b?{v:combine(b,c),src:(g==='W'?'Weekly':'Monthly')+' back data'}:null;
  }
  const[y,q]=key.split('-Q').map(Number); const ms=[];
  for(let m=(q-1)*3;m<q*3;m++){const t=Date.UTC(y,m,1);const r=base(def,'M',KEY.M(t));if(r&&r.v!=null)ms.push({t,v:r.v})}
  return ms.length?{v:combine(ms,c),src:ms.length+' month'+(ms.length>1?'s':'')}:null;
}
const byName=n=>DEF.find(d=>d.name.toLowerCase()===String(n||'').toLowerCase());
function val(def,g,key){
  if(def.comb==='ratio'){const a=byName(def.num),b=byName(def.den);if(!a||!b)return null;
    const x=base(a,g,key),y=base(b,g,key);if(!x||!y||!y.v)return null;return{v:x.v/y.v,src:x.src}}
  return base(def,g,key);
}
/* ---- targets: Targets sheet first, KPIs-sheet target as default ---- */
let TG=[], TIDX={};
const blank=()=>({D:{},W:{},M:{},Q:{}});
function buildT(){TIDX={};TG.forEach(r=>{const m=(TIDX[r.k]=TIDX[r.k]||{B:blank(),F:blank()});const b=r.b!==undefined?r.b:r.v;
  if(b!=null)m.B[r.lv][KEY[r.lv](r.t)]=b; if(r.f!=null)m.F[r.lv][KEY[r.lv](r.t)]=r.f});}
const tex=(n,g,key,ref)=>{const m=TIDX[n];return m&&m[ref][g][key]!=null?m[ref][g][key]:null};
const REFN={B:'Budget',F:'Forecast'};
const isWD=t=>{const w=D(t).getUTCDay();return w>=1&&w<=5};
function bounds(g,key){const s=Date.parse(keyStart(g,key));let e;
  if(g==='D')e=s;else if(g==='W')e=s+6*DAY;else{const d=D(s);const add=g==='M'?1:3;e=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+add,1)-DAY}return[s,e]}
function wdIn(s,e){let n=0;for(let t=s;t<=e;t+=DAY)if(isWD(t))n++;return n}
function dayTarget(d,t,ref){ // Sum KPIs: one day's share
  const x=tex(d.name,'D',KEY.D(t),ref); if(x!=null) return x;
  if(!isWD(t)) return null;
  const w=tex(d.name,'W',KEY.W(t),ref); if(w!=null){const[s,e]=bounds('W',KEY.W(t));return w/Math.max(1,wdIn(s,e))}
  const m=tex(d.name,'M',KEY.M(t),ref); if(m!=null){const[s,e]=bounds('M',KEY.M(t));return m/Math.max(1,wdIn(s,e))}
  const q=tex(d.name,'Q',KEY.Q(t),ref); if(q!=null){const[s,e]=bounds('Q',KEY.Q(t));return q/Math.max(1,wdIn(s,e))}
  return null;
}
function tgt(d,g,key,ref){ // -> {v, todate}
  ref=ref||S.ref; const dflt=ref==='B'&&d.target!=null?{v:d.target,todate:false}:null;
  const[s,e]=bounds(g,key); const partial=IDX&&IDX.max>=s&&IDX.max<e;
  if(d.comb==='sum'){
    const ex=tex(d.name,g,key,ref);
    if(ex!=null&&!partial) return {v:ex,todate:false};
    let sum=0,any=false; const end=partial?IDX.max:e;
    for(let t=s;t<=end;t+=DAY){const v=dayTarget(d,t,ref);if(v!=null){sum+=v;any=true}}
    if(any) return {v:Math.abs(sum)>=10?Math.round(sum):Math.round(sum*100)/100,todate:partial};
    return dflt;
  }
  // Average / Last / Ratio: most specific target covering the period
  const thu=g==='W'?s+3*DAY:s;
  const order=g==='D'?[['D',s],['W',s],['M',s],['Q',s]]:g==='W'?[['W',s],['M',thu],['Q',thu]]:g==='M'?[['M',s],['Q',s]]:[['Q',s]];
  for(const[lv,t] of order){const v=tex(d.name,lv,KEY[lv](t),ref);if(v!=null)return{v,todate:false}}
  if(g==='Q'){let last=null;for(let m=0;m<3;m++){const v=tex(d.name,'M',KEY.M(Date.UTC(D(s).getUTCFullYear(),D(s).getUTCMonth()+m,1)),ref);if(v!=null)last=v}if(last!=null)return{v:last,todate:false}}
  return dflt;
}
const tv=x=>x?x.v:null;
const tlabel=(x,ref)=>REFN[ref||S.ref]+(x&&x.todate?' to date':'');
function notes(g,key){return ROWS.filter(r=>r.note&&(r.lv==='D'?KEY[g](r.t)===key:(r.lv===g&&KEY[g](r.t)===key)))}

/* ================= formatting ================= */
const isPct=d=>d.unit.trim()==='%';
function nfmt(v,d){
  if(v==null||isNaN(v)) return '—';
  if(isPct(d)){const p=Math.abs(v)<=1.5?v*100:v;return p.toFixed(1)}
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+'M';
  if(a>=1e4) return Math.round(v).toLocaleString('en-US');
  return v.toLocaleString('en-US',{maximumFractionDigits:a<10?2:1});
}
const unitTxt=d=>isPct(d)?'%':d.unit;
const full=(v,d)=>v==null?'—':nfmt(v,d)+(isPct(d)?'%':(d.unit?' '+d.unit:''));
function status(v,d,T){
  if(v==null||T==null) return {c:'none',t:T==null?'No target':'No data'};
  const t=T, ok=d.better>0?v>=t:v<=t, near=d.better>0?v>=t-Math.abs(t)*0.05:v<=t+Math.abs(t)*0.05;
  return ok?{c:'good',t:'On target'}:near?{c:'warn',t:'Close'}:{c:'bad',t:'Off target'};
}
function delta(v,p,d){
  if(v==null||p==null) return '<span class="delta nu">—</span>';
  const diff=v-p; if(Math.abs(diff)<1e-12) return '<span class="delta nu">= prev.</span>';
  const good=diff*d.better>0, ar=diff>0?'▲':'▼';
  let txt; if(isPct(d)){const k=Math.abs(v)<=1.5?100:1;txt=Math.abs(diff*k).toFixed(1)+' pts'}
  else txt=p?Math.abs(diff/p*100).toFixed(1)+'%':nfmt(Math.abs(diff),d);
  return '<span class="delta '+(good?'up':'dn')+'">'+ar+' '+txt+'</span>';
}

   '<div class="cw" id="cw"></div><div class="legend"><span><i style="background:var(--s1)"></i>Selected '+GN[S.g].toLowerCase()+'</span><span><i style="background:var(--muted-bar)"></i>Other periods</span>'+'<span><i class="dash"></i>'+REFN[S.ref]+'</span>'+'</div></div>'+
   '<div class="card"><div class="ch"><h2>All KPIs</h2><span class="n">vs previous '+GN[S.g].toLowerCase()+'</span></div><div class="tw"><table style="min-width:0"><thead><tr><th>KPI</th><th class="n">'+esc(label(S.g,S.key,true))+'</th><th class="n">Prev.</th><th class="n">'+REFN[S.ref]+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>'+
   '<p class="note">Loaded from '+esc(META.file)+' · '+esc(META.at)+(META.by?' by '+esc(META.by):'')+' · Weeks, months and quarters are built from the daily rows; where a period has no daily rows its weekly or monthly back data is used. * To date: for a period still running, Sum budgets and forecasts count only the working days up to the last data date.</p></div>';
  chart($('#cw'),cd,12,220);
}

function renderKpi(d){
  const p=periods(), i=p.indexOf(S.key), list=p.slice(Math.max(0,i-23),i+1).reverse();
  const c=val(d,S.g,S.key), T=tgt(d,S.g,S.key), st=status(c&&c.v,d,tv(T));
  const combTxt={sum:'Sum of the days',avg:'Average of the days',last:'Last value of the period',ratio:esc(d.num||'?')+' ÷ '+esc(d.den||'?')}[d.comb];
  const nt=notes(S.g,S.key).filter(r=>r.k===d.name||(d.comb==='ratio'&&(r.k===d.num||r.k===d.den)));
  $('#main').innerHTML='<div class="wrap"><div class="ph"><div><div class="crumb"><a href="#" data-back>Logistics</a> › KPI</div><h1>'+esc(d.name)+'<small>'+esc(label(S.g,S.key))+'</small></h1></div>'+controls()+'</div>'+
   '<div class="metaline"><span class="mchip">Unit <b>'+esc(unitTxt(d)||'—')+'</b></span><span class="mchip">Combines <b>'+combTxt+'</b></span><span class="mchip">'+tlabel(T)+' <b>'+(T?full(T.v,d):'none')+'</b></span><span class="mchip">Default budget <b>'+(d.target!=null?full(d.target,d):'none')+'</b></span><span class="mchip">Better <b>'+(d.better>0?'higher':'lower')+'</b></span></div>'+
   '<div class="big"><div class="card"><div class="l">'+GN[S.g]+' value</div><div class="v">'+full(c&&c.v,d)+'</div><div class="s"><span class="pill '+st.c+'">'+st.t+'</span></div></div>'+
   '<div class="card"><div class="l">vs previous</div><div class="v">'+full((()=>{const pk=prevKey(S.key);const x=pk&&val(d,S.g,pk);return x?x.v:null})(),d)+'</div><div class="s">'+delta(c&&c.v,(()=>{const pk=prevKey(S.key);const x=pk&&val(d,S.g,pk);return x?x.v:null})(),d)+'</div></div>'+
   '<div class="card"><div class="l">Source</div><div class="v" style="font-size:20px">'+esc(c?c.src:'No data')+'</div></div>'+
   '<div class="card"><div class="l">Periods with data</div><div class="v">'+p.filter(k=>val(d,S.g,k)).length+'</div></div></div>'+
   '<div class="card" style="margin-top:12px"><div class="ch"><h2>Trend</h2><span class="n">click a bar to open that '+GN[S.g].toLowerCase()+'</span></div><div class="cw" id="cw"></div></div>'+
   (nt.length?'<div class="card cmt"><b>Comments in this period</b><ul class="cmts">'+nt.map(r=>'<li><small>'+esc(label('D',KEY.D(r.t)))+' · '+esc(r.k)+'</small>'+esc(r.note)+'</li>').join('')+'</ul></div>':'')+
   '<div class="card" style="margin-top:12px"><div class="ch"><h2>By '+GN[S.g].toLowerCase()+'</h2></div><div class="tw"><table><thead><tr><th>'+GN[S.g]+'</th><th class="n">Value</th><th class="n">Budget</th><th class="n">Forecast</th><th>vs '+REFN[S.ref]+'</th><th>Source</th></tr></thead><tbody>'+
   list.map(k=>{const x=val(d,S.g,k),TT=tgt(d,S.g,k),TB=tgt(d,S.g,k,'B'),TF=tgt(d,S.g,k,'F'),s=status(x&&x.v,d,tv(TT));const tc=X=>X?full(X.v,d)+(X.todate?'*':''):'—';return '<tr class="click" tabindex="0" data-key="'+k+'"'+(k===S.key?' style="font-weight:600"':'')+'><td>'+esc(label(S.g,k))+'</td><td class="n">'+full(x&&x.v,d)+'</td><td class="n">'+tc(TB)+'</td><td class="n">'+tc(TF)+'</td><td><span class="pill '+s.c+'">'+s.t+'</span></td><td class="nf">'+esc(x?x.src:'—')+'</td></tr>'}).join('')+
   '</tbody></table></div></div></div>';
  chart($('#cw'),d,24,260);
}

function chart(el,d,count,H){
  const p=periods(), i=p.indexOf(S.key), keys=p.slice(Math.max(0,i-count+1),i+1);
  const pts=keys.map(k=>{const x=val(d,S.g,k);return{k,v:x?x.v:null}});
  const W=Math.max(280,el.clientWidth||600), L=48,R=8,T=18,B=26, cw=W-L-R, ch=H-T-B;
  const sc=isPct(d)&&pts.some(x=>x.v!=null&&Math.abs(x.v)<=1.5)?100:1;
  const tsc=v=>v*(isPct(d)&&Math.abs(v)<=1.5?100:1);
  pts.forEach(x=>{const T=tgt(d,S.g,x.k);x.t=T?T.v:null});
  const vals=pts.filter(x=>x.v!=null).map(x=>x.v*sc).concat(pts.filter(x=>x.t!=null).map(x=>tsc(x.t)));
  let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn) mx=mn+1;
  const raw=(mx-mn)*1.08/4, pw=Math.pow(10,Math.floor(Math.log10(raw))), st=[1,2,2.5,5,10].map(m=>m*pw).find(m=>m>=raw); mn=Math.floor(mn/st)*st; mx=mn+st*4;
  const y=v=>T+ch-(v-mn)/(mx-mn)*ch, bw=cw/Math.max(1,keys.length), every=Math.ceil(keys.length/(W<500?6:12));
  let s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="'+esc(d.name)+' trend">';
  for(let j=0;j<=4;j++){const v=mn+(mx-mn)*j/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line-2)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(isPct(d)?v.toFixed(0):nfmt(v,{unit:''}))+'</text>'}
  pts.forEach((x,j)=>{const cx=L+j*bw;
    if(x.v!=null){const v=x.v*sc,top=y(Math.max(v,0)),h=Math.abs(y(v)-y(0));
      s+='<rect class="bar" data-key="'+x.k+'" x="'+(cx+bw*0.18)+'" y="'+top+'" width="'+(bw*0.64)+'" height="'+Math.max(1,h)+'" rx="2" fill="'+(x.k===S.key?'var(--s1)':'var(--muted-bar)')+'"/>';
      if(x.k===S.key) s+='<text class="vl" x="'+(cx+bw/2)+'" y="'+(top-5)+'" text-anchor="middle">'+nfmt(x.v,d)+'</text>';}
    if(j%every===0||x.k===S.key) s+='<text x="'+(cx+bw/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(x.k===S.key?' class="vl"':'')+'>'+esc(label(S.g,x.k,true))+'</text>';
  });
  pts.forEach((x,j)=>{if(x.t==null)return;const yy=y(tsc(x.t)),x1=L+j*bw+bw*0.06,x2=L+(j+1)*bw-bw*0.06;s+='<line x1="'+x1+'" x2="'+x2+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--tgt)" stroke-width="2" stroke-dasharray="5 3"/>'});
  s+='</svg><div class="tip" hidden></div>';
  el.innerHTML=s;
  const tip=el.querySelector('.tip');
  el.querySelectorAll('rect.bar').forEach(r=>{
    const k=r.getAttribute('data-key'), x=val(d,S.g,k), TT=tgt(d,S.g,k);
    r.addEventListener('mouseenter',()=>{tip.hidden=false;tip.innerHTML='<b>'+esc(label(S.g,k))+'</b><div class="r"><span>Value</span><span>'+full(x&&x.v,d)+'</span></div>'+(TT?'<div class="r"><span>'+tlabel(TT)+'</span><span>'+full(TT.v,d)+'</span></div>':'')+'<div class="r"><span>Source</span><span>'+esc(x?x.src:'')+'</span></div>';
      const bx=r.getBoundingClientRect(),ex=el.getBoundingClientRect();tip.style.left=Math.min(ex.width-170,Math.max(0,bx.left-ex.left-40))+'px';tip.style.top=Math.max(0,bx.top-ex.top-70)+'px'});
    r.addEventListener('mouseleave',()=>tip.hidden=true);
  });
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-g],[data-step],[data-load],[data-refresh],[data-kpi],[data-key],[data-back],[data-ref]'); if(!t) return;
  if(t.dataset.ref){S.ref=t.dataset.ref;try{localStorage.setItem(STORE+'-ref',S.ref)}catch(_){}render();return}
  if(t.hasAttribute('data-load')){$('#file').click();return}
  if(t.hasAttribute('data-refresh')){loadGraph(true);return}
  if(t.dataset.back!=null){e.preventDefault();S.view='overview';render();return}
  if(t.dataset.g){const old=S.key&&IDX?Math.min(bounds(S.g,S.key)[1],IDX.max):null;S.g=t.dataset.g;S.key=null;if(old!=null){const k=KEY[S.g](old);if(periods().includes(k))S.key=k}render();return}
  if(t.dataset.step){const p=periods();const i=p.indexOf(S.key)+(+t.dataset.step);if(p[i])S.key=p[i];render();return}
  if(t.dataset.kpi){S.view=t.dataset.kpi;render();window.scrollTo(0,0);return}
  if(t.dataset.key){S.key=t.dataset.key;render();return}
});
function keyStart(g,k){
  if(g==='D') return k+'T00:00:00Z';
  if(g==='W'){const[y,w]=k.split('-W').map(Number);return isoD(weekMonday(y,w))+'T00:00:00Z'}
  if(g==='M') return k+'-01T00:00:00Z';
  const[y,q]=k.split('-Q');return y+'-'+pad((q-1)*3+1)+'-01T00:00:00Z';
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-kpi],[data-key]'))e.target.click()});
document.addEventListener('change',e=>{
  if(e.target.id==='per'){S.key=e.target.value;render()}
  if(e.target.id==='chartSel'){S.chart=e.target.value;chart($('#cw'),byName(S.chart),12,220);
    const lg=e.target.closest('.card').querySelector('.legend');}
  if(e.target.id==='file'&&e.target.files[0]){load(e.target.files[0]);e.target.value=''}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>IDX&&render(),150)});
let dc=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').classList.add('on')});
window.addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#drop').classList.remove('on')}});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('on');const f=e.dataTransfer.files[0];if(f)load(f)});

const stamp=d=>pad(d.getDate())+' '+MN[d.getMonth()]+' '+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
let PUB=null; // published data.xlsx next to this page
async function load(f){
  try{
    const res=parse(await readXlsx(await f.arrayBuffer()));
    apply(res.defs,res.rows,{file:f.name,at:'loaded '+stamp(new Date()),local:true},res.tg);
    S.key=null;S.view='overview';S.chart=null;
    if(!PUB){try{localStorage.setItem(STORE,JSON.stringify({DEF,ROWS,META,WARN,TG}))}catch(_){}}
    render();
  }catch(err){ if(IDX){WARN=[String(err.message||err)].concat(WARN);render()} else renderEmpty(String(err.message||err)); }
}
function showPublished(){WARN=PUB.warn;apply(PUB.defs,PUB.rows,PUB.meta,PUB.tg);S.key=null;S.view='overview';render()}
function apply(defs,rows,meta,tg){DEF=defs;ROWS=rows;META=meta;TG=tg||[];build();buildT()}
window.__eciLoad=load;
document.addEventListener('click',e=>{if(e.target.closest('[data-home]')){e.preventDefault();S.view='overview';S.key=null;if(IDX)render();window.scrollTo(0,0);return}if(e.target.closest('[data-pub]')){e.preventDefault();showPublished()}});
try{const r=localStorage.getItem(STORE+'-ref');if(r==='B'||r==='F')S.ref=r}catch(_){}
/* ================= Microsoft sign-in (OAuth 2.0 code flow + PKCE, no library) ================= */
const TK=STORE+'-auth', AUTHZ='https://login.microsoftonline.com/'+CFG.tenantId+'/oauth2/v2.0/';
const SCOPE='openid profile offline_access User.Read Files.Read.All';
const REDIR=location.origin+'/';
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rand=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
const getTok=()=>{try{return JSON.parse(localStorage.getItem(TK)||'null')}catch(_){return null}};
const setTok=x=>{try{x?localStorage.setItem(TK,JSON.stringify(x)):localStorage.removeItem(TK)}catch(_){}};
function idName(idt){try{const p=JSON.parse(decodeURIComponent(escape(atob(idt.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));return p.name||p.preferred_username||''}catch(_){return ''}}
async function signIn(){
  const verifier=rand(48), state=rand(16);
  const challenge=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
  try{sessionStorage.setItem(TK+'-pkce',JSON.stringify({verifier,state}))}catch(_){}
  location.href=AUTHZ+'authorize?'+new URLSearchParams({client_id:CFG.clientId,response_type:'code',redirect_uri:REDIR,scope:SCOPE,
    code_challenge:challenge,code_challenge_method:'S256',state,response_mode:'query',prompt:'select_account'});
}
function signOut(){setTok(null);try{localStorage.removeItem(STORE)}catch(_){}
  location.href=AUTHZ+'logout?post_logout_redirect_uri='+encodeURIComponent(REDIR)}
async function tokenCall(body){
  const r=await fetch(AUTHZ+'token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams(Object.assign({client_id:CFG.clientId,scope:SCOPE},body))});
  const j=await r.json(); if(!r.ok) throw new Error(j.error_description?j.error_description.split('\r\n')[0]:'Sign-in failed');
  const prev=getTok()||{};
  const tok={at:j.access_token,rt:j.refresh_token||prev.rt,exp:Date.now()+(j.expires_in-120)*1000,name:j.id_token?idName(j.id_token):prev.name};
  setTok(tok); return tok;
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search); if(!q.has('code')&&!q.has('error')) return null;
  history.replaceState(null,'',location.pathname);
  if(q.has('error')) throw new Error((q.get('error_description')||q.get('error')).split('\r\n')[0].replace(/\+/g,' '));
  let pk={};try{pk=JSON.parse(sessionStorage.getItem(TK+'-pkce')||'{}')}catch(_){}
  if(!pk.verifier||pk.state!==q.get('state')) throw new Error('Sign-in was interrupted, please try again.');
  return tokenCall({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIR,code_verifier:pk.verifier});
}
async function accessToken(){
  const t=getTok(); if(!t) return null;
  if(t.at&&t.exp>Date.now()) return t;
  if(t.rt){try{return await tokenCall({grant_type:'refresh_token',refresh_token:t.rt})}catch(_){setTok(null)}}
  return null;
}
function renderSignIn(err){
  $('#fileChip').hidden=true;
  $('#main').innerHTML='<div class="wrap">'+(err?'<div class="warnbox err" style="margin-top:16px">'+esc(err)+'</div>':'')+
  '<div class="card empty"><h2>Sign in to see the logistics KPIs</h2><p>Use your ECI Microsoft account. The data is read from OneDrive with your own access – nothing is stored on this site.</p>'+
  '<button class="btn" data-signin><svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg> Sign in with Microsoft</button></div></div>';
}
document.addEventListener('click',e=>{if(e.target.closest('[data-signin]')){signIn()}if(e.target.closest('[data-signout]')){e.preventDefault();signOut()}});
async function loadGraph(manual){
  const tok=await accessToken(); if(!tok){renderSignIn();return}
  if(manual||!IDX) $('#main').innerHTML='<div class="wrap"><p class="note" style="margin-top:40px;text-align:center">Reading data.xlsx from OneDrive…</p></div>';
  try{
    const H={authorization:'Bearer '+tok.at};
    const item=await fetch('https://graph.microsoft.com/v1.0/shares/u!'+b64u(new TextEncoder().encode(CFG.fileLink))+'/driveItem',{headers:H});
    if(item.status===401){setTok(null);renderSignIn('Your session expired, please sign in again.');return}
    if(item.status===403||item.status===404) throw new Error('Your account cannot open the logistics Excel. Ask the file owner to share it with you.');
    if(!item.ok) throw new Error('OneDrive answered '+item.status+'. Try Refresh in a minute.');
    const it=await item.json(); const url=it['@microsoft.graph.downloadUrl'];
    if(!url) throw new Error('OneDrive did not give a download link for the file.');
    const f=await fetch(url,{cache:'no-store'}); if(!f.ok) throw new Error('Download failed ('+f.status+').');
    const res=parse(await readXlsx(await f.arrayBuffer()));
    const by=it.lastModifiedBy&&it.lastModifiedBy.user&&it.lastModifiedBy.user.displayName;
    PUB={defs:res.defs,rows:res.rows,tg:res.tg,warn:WARN.slice(),
      meta:{file:'OneDrive (live)',at:'published '+stamp(new Date(it.lastModifiedDateTime||Date.now())),by,user:tok.name,local:false}};
    showPublished();
  }catch(err){ renderEmptyAuth(String(err.message||err)); }
}
function renderEmptyAuth(msg){
  $('#main').innerHTML='<div class="wrap"><div class="warnbox err" style="margin-top:16px">'+esc(msg)+'</div>'+
  '<div class="card empty"><h2>Could not load the data</h2><p>Signed in as '+esc((getTok()||{}).name||'')+'.</p><button class="btn" data-refresh>⟳ Try again</button> <a href="#" data-signout style="margin-left:12px;color:var(--eci)">Sign out</a></div></div>';
}

(async function init(){
  $('#main').innerHTML='<div class="wrap"><p class="note" style="margin-top:40px;text-align:center">Loading the latest data…</p></div>';
  if(AUTH){
    try{await handleRedirect()}catch(err){renderSignIn(String(err.message||err));return}
    return loadGraph(false);
  }
  // Upload mode: show the last Excel loaded on this device; otherwise ask for the file
  try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.ROWS&&s.ROWS.length){WARN=s.WARN||[];apply(s.DEF,s.ROWS,s.META,s.TG)}}catch(_){}
  render();
})();
})();
</script>
